[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live MariaDB/MySQL instance (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM"]
ignore = ["B008"]  # FastAPI dependencies are called in default args by design

[tool.ruff.lint.isort]
known-first-party = ["app"]
