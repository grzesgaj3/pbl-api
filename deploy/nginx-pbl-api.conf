# Example nginx reverse proxy for pbl-api.
#
# Install:
#   sudo cp deploy/nginx-pbl-api.conf /etc/nginx/sites-available/pbl-api
#   sudo ln -s /etc/nginx/sites-available/pbl-api /etc/nginx/sites-enabled/pbl-api
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the certificate (this rewrites the server block for you):
#   sudo certbot --nginx -d pbl.example.com
#
# The SSL directives below are a manual alternative to certbot.

upstream pbl_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name pbl.example.com;

    location / {
        return 301 https://$host$request_uri;
    }

    # Allow the ACME http-01 challenge over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx >= 1.25.1; on older versions use: listen 443 ssl http2;
    server_name pbl.example.com;

    ssl_certificate     /etc/letsencrypt/live/pbl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pbl.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;

    # Requests are tiny JSON documents; reject anything oversized.
    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://pbl_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # Health checks need no access log.
    location = /health {
        proxy_pass http://pbl_api/health;
        access_log off;
    }
}
